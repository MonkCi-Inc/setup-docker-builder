name: 'MonkCI Setup Docker Builder'
description: 'Sets up a Docker BuildKit builder with persistent cache for blazing fast builds'
author: 'MonkCI'

branding:
  icon: 'layers'
  color: 'purple'

inputs:
  buildkit-version:
    description: 'BuildKit version (e.g., v0.16.0). Empty uses latest.'
    required: false
    default: ''
  platforms:
    description: 'Target platforms for build (e.g., linux/amd64,linux/arm64)'
    required: false
    default: ''
  nofallback:
    description: 'If true, fail instead of falling back to local builder'
    required: false
    default: 'false'

outputs:
  builder-name:
    description: 'Name of the Docker builder instance'
  cache-hit:
    description: 'Whether an existing cache was found (true/false)'
  volume-name:
    description: 'Cache volume name'
  mount-path:
    description: 'Path where cache is mounted'
  cache-role:
    description: >-
      Controller-assigned cache role for this lease: canonical_writer or
      disposable_clone. Empty when the cache path is disabled or the runner
      agent predates the output.
  bundle-sha:
    description: >-
      Full git SHA of the miglet source this action's bundled binaries were
      built from. Lets workflows pin/assert bundle provenance instead of
      trusting a mutable tag. Empty when the bundle predates the output.

runs:
  using: 'node20'
  main: 'dist/index.js'
  post: 'dist/post.js'
